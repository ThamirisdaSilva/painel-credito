<h2>Solicitações</h2>

@if (service.loading()) {
  <p>Carregando...</p>
}

@if (service.error()) {
  <p>{{ service.error() }}</p>
}

@if (!service.loading() && !service.error()) {
  <div class="lista">
    @for (item of service.solicitacoes(); track item.id) {
      <app-solicitacao-item [solicitacao]="item"></app-solicitacao-item>
    }
  </div>
}
