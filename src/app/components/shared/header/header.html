<header class="header">
  @if (isOffline) {
    <div class="offline-banner">Você está navegando sem internet. Verifique sua conexão.</div>
  }

  <div class="header__container">
    <div>
      <h1 class="header__title">{{ title }}</h1>

      <p class="header__subtitle">Gerencie e acompanhe as solicitações de crédito</p>
    </div>

    @if (authService.usuario() && !estaNaTelaLogin()) {
      <div class="header__auth">
        <button type="button" class="header__logout" (click)="logout()">Sair</button>
      </div>
    }
  </div>
</header>
